<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Mensal</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/logo.svg' | relative_url }}" type="image/svg+xml">
  <style>
    :root { --primary: #5B2A86; --secondary: #EFE6F8; --accent: #F5A524; --ink: #24123A; --muted: #7A6A8E; --bg: #F7F3FB; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--primary); color: #fff; }
    .bar { max-width: 760px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; font-weight: 700; font-size: 20px; }
    .brand img { width: 36px; height: 36px; background: #fff; border-radius: 10px; padding: 2px; }
    nav { margin-left: auto; display: flex; gap: 16px; }
    nav a { color: var(--secondary); text-decoration: none; }
    nav a:hover { color: #fff; text-decoration: underline; }
    main { max-width: 760px; margin: 24px auto; padding: 28px 24px; background: #fff; border-radius: 20px; box-shadow: 0 6px 24px #3C145A1A; }
    h1 { color: var(--primary); line-height: 1.25; margin-top: 0; }
    h2 { color: var(--primary); font-size: 1.2em; margin-top: 1.8em; }
    a { color: var(--primary); }
    .updated { color: var(--muted); font-size: 0.9em; }
    footer { max-width: 760px; margin: 0 auto 32px; padding: 0 20px; color: var(--muted); font-size: 0.85em; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/logo.svg' | relative_url }}" alt="">Mensal</a>
      <nav>
        <a href="{{ '/privacidade/' | relative_url }}">Privacidade</a>
        <a href="{{ '/termos/' | relative_url }}">Termos de uso</a>
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>Mensal · Todas as contas, um só rumo. · Henrique Gouvêa · <a href="mailto:henriquegouvea90@gmail.com">henriquegouvea90@gmail.com</a></footer>
</body>
</html>
