name: Code review (Claude)

# Reviews every pull request with the instructions in .claude/agents/code-reviewer.md and posts the findings as
# inline comments. One-time setup by the repo owner (without the secret the review is skipped):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Run `claude setup-token` on your machine (uses your Claude subscription) and save the token it prints as the
#      repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings > Secrets and variables > Actions).
# To pay per use with an API key instead, save it as ANTHROPIC_API_KEY and swap the token input and env below for it.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are reviewed once marked ready; PRs from forks and Dependabot get no secrets.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Skip without the token
        if: env.CLAUDE_CODE_OAUTH_TOKEN == ''
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN isn't set, so the review is skipped."

      - uses: actions/checkout@v4
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        with:
          fetch-depth: 1

      - name: Review
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read .claude/agents/code-reviewer.md and follow it exactly: what to review,
            what to look for and how to report. Read CLAUDE.md too, since its rules are part of the review.

            - Get the change with `gh pr diff ${{ github.event.pull_request.number }}` and the description with
              `gh pr view ${{ github.event.pull_request.number }}`. Read any file you need from the checkout.
            - Before commenting, read the comments already on the PR (`gh pr view ${{ github.event.pull_request.number }} --comments`)
              and don't repeat a finding that is already there. After a new push, review what changed.
            - Post each finding as an inline comment on its line (mcp__github_inline_comment__create_inline_comment),
              starting with its severity in bold (**Critical**, **Major** or **Minor**).
            - Then post one top-level comment with `gh pr comment`: the number of findings per severity and a line
              on anything that doesn't fit an inline comment, or "No findings." when there are none.
            - Write in English. Don't approve, request changes, push commits or edit files.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
