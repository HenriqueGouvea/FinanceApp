name: Release (Android)

# Pushing a v* tag (e.g. v1.0.0) builds a signed AAB and uploads it to Google Play's internal testing track.
# Running it by hand only builds the signed AAB and keeps it as an artifact: Play's API can't upload the first
# build of a new app, so that one is uploaded in Play Console (see RELEASING.md).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_ID: io.github.henriquegouvea.mensal

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    # versionCode must grow with every upload: the run number does, plus an optional offset
    # (repository variable VERSION_CODE_OFFSET) in case this workflow is ever renamed and its count restarts.
    - name: Compute version
      id: version
      env:
        OFFSET: ${{ vars.VERSION_CODE_OFFSET || '0' }}
      run: |
        code=$(( ${{ github.run_number }} + OFFSET ))
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          name="${GITHUB_REF_NAME#v}"
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
        fi
        echo "versionCode $code, versionName ${name:-from the csproj}"

    - name: Check signing secrets
      env:
        KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        for name in KEYSTORE STORE_PASS KEY_ALIAS KEY_PASS; do
          if [[ -z "${!name}" ]]; then
            echo "::error::Missing signing secret ($name). See RELEASING.md."
            exit 1
          fi
        done

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android

    # The keystore only exists on the runner for this job; the passwords are read from the environment
    # (env: prefix) so they never show up on a command line.
    - name: Restore upload key
      env:
        KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.keystore"

    - name: Build signed AAB
      env:
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        VERSION_NAME: ${{ steps.version.outputs.name }}
      run: |
        args=(
          FinanceApp/FinanceApp.csproj -f net10.0-android -c Release -o artifacts/release
          -p:AndroidPackageFormats=aab
          -p:ApplicationVersion=${{ steps.version.outputs.code }}
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.keystore"
          -p:AndroidSigningKeyAlias="$KEY_ALIAS"
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
        )
        if [[ -n "$VERSION_NAME" ]]; then args+=(-p:ApplicationDisplayVersion="$VERSION_NAME"); fi
        dotnet publish "${args[@]}"

    - name: Remove upload key
      if: always()
      run: rm -f "$RUNNER_TEMP/upload.keystore"

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: mensal-aab-${{ steps.version.outputs.code }}
        path: artifacts/release/${{ env.PACKAGE_ID }}-Signed.aab
        if-no-files-found: error
        retention-days: 30

    # Until the app has passed its first review, Play only accepts draft releases: the release then waits in
    # Play Console to be rolled out by hand. Set the repository variable PLAY_RELEASE_STATUS to "completed" after that.
    - name: Upload to Google Play (internal testing)
      if: github.ref_type == 'tag'
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: ${{ env.PACKAGE_ID }}
        releaseFiles: artifacts/release/${{ env.PACKAGE_ID }}-Signed.aab
        releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
        track: internal
        status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
