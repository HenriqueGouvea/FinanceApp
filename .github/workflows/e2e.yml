name: E2E (Android)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    # Linux runners expose KVM, so the x86_64 emulator runs hardware-accelerated (Windows/macOS hosted runners do not).
    runs-on: ubuntu-latest
    # Safety net only: the suite takes about half of this. A hung run is cancelled instead of burning hours.
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    # The MAUI workload, APK, AVD and system image can exhaust the runner's disk ("No space left on device"),
    # so drop preinstalled toolchains this job never uses.
    - name: Free disk space
      run: sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: FinanceApp.UITests/package-lock.json

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android

    - name: Build standalone debug APK
      run: dotnet build FinanceApp/FinanceApp.csproj -f net10.0-android -c Debug -p:EmbedAssembliesIntoApk=true -o artifacts/e2e-apk

    - name: Install Appium
      working-directory: FinanceApp.UITests
      run: npm ci

    - name: Build E2E tests
      run: dotnet build FinanceApp.UITests/FinanceApp.UITests.csproj

    - name: Cache AVD
      uses: actions/cache@v4
      id: avd-cache
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-api33-google_apis-x86_64

    - name: Create AVD snapshot
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: echo "AVD snapshot generated"

    - name: Run E2E tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: dotnet test FinanceApp.UITests/FinanceApp.UITests.csproj --no-build --logger "trx;LogFileName=e2e.trx" --logger "console;verbosity=normal" --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-results
        # The TRX is only written when the run completes; diagnostics (screenshot + page source per timeout) are saved as they happen.
        path: |
          TestResults
          FinanceApp.UITests/TestResults/diagnostics
