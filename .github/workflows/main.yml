name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore

    - name: Build App (Net10 Target)
      run: dotnet build FinanceApp/FinanceApp.csproj -c Release -f net10.0

    - name: Run Tests
      run: dotnet test FinanceApp.Tests/FinanceApp.Tests.csproj -c Release --no-build --verbosity normal